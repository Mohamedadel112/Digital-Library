<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Digital Library</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/Css/style.css">
</head>
<body class="dashboard">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center w-100">
        <a href="/dashboard" class="navbar-brand">
          <i class="fas fa-book-open"></i>
          Digital Library
        </a>
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">U</div>
          <span id="userName" style="font-weight: 600; color: var(--dark);">User</span>
          <button class="btn btn-sm btn-secondary" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="main-content">
    <div class="container">
      
      <!-- Stats Section -->
      <div id="statsSection" class="stats-container">
        <!-- Will be populated dynamically -->
      </div>

      <!-- Books Header -->
      <div class="books-header">
        <div class="d-flex justify-content-between align-items-center flex-wrap">
          <h3><i class="fas fa-books"></i> My Library</h3>
          <button class="btn btn-primary" onclick="openAddBookModal()">
            <i class="fas fa-plus"></i> Add Book
          </button>
        </div>

        <!-- Filters -->
        <div class="filters">
          <button class="filter-btn active" data-filter="all" onclick="filterBooks('all')">
            <i class="fas fa-th"></i> All Books
          </button>
          <button class="filter-btn" data-filter="Want to read" onclick="filterBooks('Want to read')">
            <i class="fas fa-bookmark"></i> Want to Read
          </button>
          <button class="filter-btn" data-filter="Reading" onclick="filterBooks('Reading')">
            <i class="fas fa-book-reader"></i> Reading
          </button>
          <button class="filter-btn" data-filter="Finished" onclick="filterBooks('Finished')">
            <i class="fas fa-check-circle"></i> Finished
          </button>
        </div>

        <!-- Search -->
        <div class="mt-3">
          <input 
            type="text" 
            class="form-control" 
            id="searchInput" 
            placeholder="Search books by title or author..."
            onkeyup="handleSearchInput()"
          >
        </div>
      </div>

      <!-- Books Grid -->
      <div id="booksGrid" class="books-grid">
        <!-- Will be populated dynamically -->
      </div>

    </div>
  </div>

  <!-- Add/Edit Book Modal -->
  <div class="modal" id="bookModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Book</h3>
        <button class="close-btn" onclick="closeBookModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="bookForm">
          <input type="hidden" id="bookId">
          
          <div class="form-group">
            <label for="title"><i class="fas fa-book"></i> Title</label>
            <input type="text" class="form-control" id="title" required placeholder="Enter book title">
          </div>

          <div class="form-group">
            <label for="author"><i class="fas fa-user-edit"></i> Author</label>
            <input type="text" class="form-control" id="author" required placeholder="Enter author name">
          </div>

          <div class="form-group">
            <label for="category"><i class="fas fa-tag"></i> Category</label>
            <select class="form-control" id="category" required>
              <option value="">Select a category</option>
              <option value="Novel">Novel</option>
              <option value="Scientific">Scientific</option>
              <option value="History">History</option>
              <option value="Self Development">Self Development</option>
              <option value="Technology">Technology</option>
              <option value="Others">Others</option>
            </select>
          </div>

          <div class="form-group">
            <label for="totalPages"><i class="fas fa-file-alt"></i> Total Pages</label>
            <input type="number" class="form-control" id="totalPages" min="1" required placeholder="Enter total number of pages">
          </div>

          <div class="form-group">
            <label for="currentPage"><i class="fas fa-bookmark"></i> Current Page</label>
            <input type="number" class="form-control" id="currentPage" min="0" value="0" placeholder="Current reading progress">
          </div>

          <div class="form-group">
            <label for="notes"><i class="fas fa-sticky-note"></i> Notes</label>
            <textarea class="form-control" id="notes" rows="4" placeholder="Add any notes about this book..."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeBookModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveBook()" id="saveBtn">
          <i class="fas fa-save"></i> Save Book
        </button>
      </div>
    </div>
  </div>

  <!-- Update Progress Modal -->
  <div class="modal" id="progressModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Update Reading Progress</h3>
        <button class="close-btn" onclick="closeProgressModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="progressBookId">
        <div class="form-group">
          <label for="progressPage"><i class="fas fa-book-open"></i> Current Page</label>
          <input type="number" class="form-control" id="progressPage" min="0" placeholder="Enter current page">
          <small class="text-muted" style="margin-top: 8px; display: block;">Total pages: <span id="progressTotal">0</span></small>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeProgressModal()">Cancel</button>
        <button class="btn btn-primary" onclick="updateProgress()">
          <i class="fas fa-save"></i> Update Progress
        </button>
      </div>
    </div>
  </div>

  <!-- Rate Book Modal -->
  <div class="modal" id="rateModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Rate This Book</h3>
        <button class="close-btn" onclick="closeRateModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="rateBookId">
        <div class="form-group text-center">
          <div class="stars" style="font-size: 48px; cursor: pointer; justify-content: center;">
            <i class="far fa-star" data-rating="1" onclick="setRating(1)" onmouseover="highlightStars(1)" onmouseout="resetStars()"></i>
            <i class="far fa-star" data-rating="2" onclick="setRating(2)" onmouseover="highlightStars(2)" onmouseout="resetStars()"></i>
            <i class="far fa-star" data-rating="3" onclick="setRating(3)" onmouseover="highlightStars(3)" onmouseout="resetStars()"></i>
            <i class="far fa-star" data-rating="4" onclick="setRating(4)" onmouseover="highlightStars(4)" onmouseout="resetStars()"></i>
            <i class="far fa-star" data-rating="5" onclick="setRating(5)" onmouseover="highlightStars(5)" onmouseout="resetStars()"></i>
          </div>
          <input type="hidden" id="ratingValue">
          <p id="ratingText" style="margin-top: 16px; font-weight: 600; color: var(--gray);">Click a star to rate</p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeRateModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveRating()">
          <i class="fas fa-save"></i> Save Rating
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/Config.js"></script>
  <script src="/js/Book.js"></script>
</body>
</html>
