<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Digital Library</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/Css/style.css">
</head>
<body>
  
  <div class="auth-container">
    <div class="auth-card">
      <!-- Header -->
      <div class="auth-header">
        <i class="fas fa-user-plus"></i>
        <h2>Create Account</h2>
        <p>Start your reading journey with us</p>
      </div>

      <!-- Body -->
      <div class="auth-body">
        <!-- Alert -->
        <div id="alert" style="display: none;"></div>

        <!-- Register Form -->
        <form id="registerForm">
          <div class="form-group">
            <label for="name">
              <i class="fas fa-user"></i> Full Name
            </label>
            <input 
              type="text" 
              class="form-control" 
              id="name" 
              placeholder="Enter your full name"
              required
              autocomplete="name"
            >
          </div>

          <div class="form-group">
            <label for="email">
              <i class="fas fa-envelope"></i> Email Address
            </label>
            <input 
              type="email" 
              class="form-control" 
              id="email" 
              placeholder="Enter your email"
              required
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label for="password">
              <i class="fas fa-lock"></i> Password
            </label>
            <input 
              type="password" 
              class="form-control" 
              id="password" 
              placeholder="Enter password (minimum 6 characters)"
              minlength="6"
              required
              autocomplete="new-password"
            >
          </div>

          <button type="submit" class="btn btn-primary" id="registerBtn">
            <i class="fas fa-user-plus"></i> Create Account
          </button>
        </form>

        <!-- Footer -->
        <div class="auth-footer">
          <p>Already have an account? <a href="/index.html">Sign In</a></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/Config.js"></script>
  <script>
    // Prevent access if already logged in
    if (getToken()) {
      window.location.href = '/dashboard';
    }

    const registerForm = document.getElementById('registerForm');
    const alertDiv = document.getElementById('alert');
    const registerBtn = document.getElementById('registerBtn');

    // Show alert message
    function showAlert(message, type = 'danger') {
      alertDiv.className = `alert alert-${type}`;
      const icon = type === 'danger' ? 'exclamation-circle' : 'check-circle';
      alertDiv.innerHTML = `<i class="fas fa-${icon}"></i> ${message}`;
      alertDiv.style.display = 'block';
      
      setTimeout(() => {
        alertDiv.style.display = 'none';
      }, 5000);
    }

    // Handle registration
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Validate input
      if (!name || !email || !password) {
        showAlert('Please fill in all fields');
        return;
      }

      if (password.length < 6) {
        showAlert('Password must be at least 6 characters long');
        return;
      }

      // Disable button and show loading
      registerBtn.disabled = true;
      registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

      try {
        const response = await fetch(`${API_URL}/auth/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ user: name, email, password })
        });

        const contentType = response.headers.get('content-type');
        
        if (!contentType || !contentType.includes('application/json')) {
          const text = await response.text();
          console.error('Response is not JSON:', text);
          throw new Error('Server returned an invalid response. Please check your backend connection.');
        }

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Registration failed. Please try again.');
        }

        // Save token and user data
        setToken(data.token);
        setUser({
          id: data._id,
          name: data.user,
          email: data.email
        });

        // Show success message
        showAlert('Account created successfully! Redirecting...', 'success');

        // Redirect to dashboard
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 1000);

      } catch (error) {
        showAlert(error.message || 'An error occurred. Please try again.');
        registerBtn.disabled = false;
        registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
      }
    });
  </script>
</body>
</html>
