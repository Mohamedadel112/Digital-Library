<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Digital Library</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/Css/style.css">
</head>
<body>
  
  <div class="auth-container">
    <div class="auth-card">
      <!-- Header -->
      <div class="auth-header">
        <i class="fas fa-book-open"></i>
        <h2>Digital Library</h2>
        <p>Welcome to your personal reading space</p>
      </div>

      <!-- Body -->
      <div class="auth-body">
        <!-- Alert -->
        <div id="alert" style="display: none;"></div>

        <!-- Login Form -->
        <form id="loginForm">
          <div class="form-group">
            <label for="email">
              <i class="fas fa-envelope"></i> Email Address
            </label>
            <input 
              type="email" 
              class="form-control" 
              id="email" 
              placeholder="Enter your email"
              required
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label for="password">
              <i class="fas fa-lock"></i> Password
            </label>
            <input 
              type="password" 
              class="form-control" 
              id="password" 
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
          </div>

          <button type="submit" class="btn btn-primary" id="loginBtn">
            <i class="fas fa-sign-in-alt"></i> Sign In
          </button>
        </form>

        <!-- Footer -->
        <div class="auth-footer">
          <p>Don't have an account? <a href="/Register.html">Register Now</a></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/Config.js"></script>
  <script>
    // Prevent access if already logged in
    if (getToken()) {
      window.location.href = '/dashboard';
    }

    const loginForm = document.getElementById('loginForm');
    const alertDiv = document.getElementById('alert');
    const loginBtn = document.getElementById('loginBtn');

    // Show alert message
    function showAlert(message, type = 'danger') {
      alertDiv.className = `alert alert-${type}`;
      const icon = type === 'danger' ? 'exclamation-circle' : 'check-circle';
      alertDiv.innerHTML = `<i class="fas fa-${icon}"></i> ${message}`;
      alertDiv.style.display = 'block';
      
      setTimeout(() => {
        alertDiv.style.display = 'none';
      }, 5000);
    }

    // Handle login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Validate input
      if (!email || !password) {
        showAlert('Please fill in all fields');
        return;
      }

      // Disable button and show loading
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

      try {
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const contentType = response.headers.get('content-type');
        
        if (!contentType || !contentType.includes('application/json')) {
          const text = await response.text();
          console.error('Response is not JSON:', text);
          throw new Error('Server returned an invalid response. Please check your backend connection.');
        }

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Login failed. Please check your credentials.');
        }

        // Save token and user data
        setToken(data.token);
        setUser({
          id: data._id,
          name: data.user,
          email: data.email
        });

        // Show success message
        showAlert('Login successful! Redirecting...', 'success');

        // Redirect to dashboard
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 1000);

      } catch (error) {
        showAlert(error.message || 'An error occurred. Please try again.');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      }
    });
  </script>
</body>
</html>
